<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin sign in · India Audio Guide</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#B4441A" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("iag-admin-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/admin/admin.css" />
  </head>
  <body class="admin-page">
    <a class="skip" href="#admin-main">Skip to content</a>
    <header class="admin-header">
      <div class="wrap admin-header-bar">
        <div class="admin-brand">
          <img
            id="admin-logo"
            src="/icons/icon_light.svg"
            width="44"
            height="44"
            alt=""
          />
          <span class="brand-name">India Audio Guide</span>
        </div>
        <div class="admin-header-actions">
          <button
            type="button"
            class="icon-btn admin-theme-toggle"
            id="theme-toggle"
            aria-label="Switch to dark mode"
            data-theme="light"
          >
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12.1 22c-5.2 0-9.4-4.1-9.4-9.2 0-4.3 2.9-8 7-9.1.5-.1.9.4.7.8A7.3 7.3 0 0 0 18.5 14c.4-.1.9.3.8.7-1 3.9-4.5 6.7-8.6 7.1-.2 0-.4.2-.6.2z"
              />
            </svg>
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0-5c.6 0 1 .4 1 1v1a1 1 0 1 1-2 0V3c0-.6.4-1 1-1zm0 18c.6 0 1 .4 1 1v1a1 1 0 1 1-2 0v-1c0-.6.4-1 1-1zM3 11h1a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2zm17 0h1a1 1 0 1 1 0 2h-1a1 1 0 1 1 0-2zM5.6 4.2a1 1 0 0 1 1.4 0l.7.7a1 1 0 1 1-1.4 1.4l-.7-.7a1 1 0 0 1 0-1.4zm12.7 12.7a1 1 0 0 1 1.4 0l.7.7a1 1 0 1 1-1.4 1.4l-.7-.7a1 1 0 0 1 0-1.4zM18.4 4.2a1 1 0 0 1 0 1.4l-.7.7a1 1 0 1 1-1.4-1.4l.7-.7a1 1 0 0 1 1.4 0zM6.3 16.9a1 1 0 0 1 0 1.4l-.7.7a1 1 0 1 1-1.4-1.4l.7-.7a1 1 0 0 1 1.4 0z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="icon-btn admin-logout"
            id="header-sign-out"
            aria-label="Sign out"
            hidden
          >
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M10 17v-3h4v-4h-4V7l-5 5 5 5zm9-13H9c-1.1 0-2 .9-2 2v3h2V6h10v12H9v-3H7v3c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main id="admin-main" class="wrap admin-main">
      <p class="section-kicker" id="env-kicker">Admin</p>
      <h1 id="page-title" hidden>Sign in</h1>
      <p class="section-lead" id="intro" hidden>
        Use the phone number on your account. Only admins can stay signed in.
      </p>

      <p id="status" class="status" hidden role="status"></p>
      <p id="error" class="error" hidden role="alert"></p>

      <section id="checking" class="note">
        <h2>Checking access…</h2>
        <p>Please wait while we confirm your account.</p>
      </section>

      <form id="login-form" class="note admin-form" hidden>
        <label for="phone">Mobile number</label>
        <div class="phone-field">
          <span class="phone-prefix" aria-hidden="true">+91</span>
          <input
            id="phone"
            name="phone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            maxlength="15"
            placeholder="10-digit number"
            aria-describedby="phone-prefix-sr"
            required
          />
          <span id="phone-prefix-sr" class="sr-only">Country code plus nine one is fixed. Enter the ten-digit mobile number.</span>
        </div>
        <div id="code-field" hidden>
          <label for="code">SMS code</label>
          <input
            id="code"
            name="code"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="one-time-code"
          />
        </div>
        <div id="recaptcha-container"></div>
        <button type="submit" class="btn" id="primary-action">Send code</button>
        <button type="button" class="btn-text" id="change-number" hidden>
          Change number
        </button>
      </form>

      <section id="signed-in" class="note" hidden>
        <h2 class="sr-only">Signed in</h2>
        <p id="signed-in-body"></p>
        <p id="signed-in-extra"></p>
      </section>

      <section id="admin-tools" class="admin-tools" hidden aria-label="Admin tools"></section>
    </main>
    <script type="module" src="/src/admin/main.js"></script>
  </body>
</html>
